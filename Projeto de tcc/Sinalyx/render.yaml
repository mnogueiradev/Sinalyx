databases:
  - name: sinalyx-db
    databaseName: sinalyx
    user: sinalyx
    plan: free

services:
  # ── API (Backend FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: sinalyx-api
    runtime: docker
    rootDir: "Projeto de tcc/Sinalyx"
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SINALYX_ENV
        value: production
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sinalyx-db
          property: connectionString
      - key: POSTGRES_DB
        value: sinalyx
      - key: POSTGRES_USER
        value: sinalyx
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: sinalyx-db
          property: password
      - key: SINALYX_AUTH_SECRET_KEY
        generateValue: true
      - key: SINALYX_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: SINALYX_ADMIN_NAME
        value: Administrador Sinalyx
      - key: SINALYX_ADMIN_EMAIL
        value: admin@sinalyx.local
      - key: SINALYX_ADMIN_PASSWORD
        sync: false   # Defina manualmente no painel do Render
      - key: SINALYX_SUPER_ADMIN_EMAIL
        value: admin@sinalyx.local
      - key: SINALYX_CORS_ORIGINS
        sync: false   # Preencha com a URL do frontend após o deploy

  # ── Frontend Mobile (Flutter Web) ──────────────────────────────────────────
  - type: web
    name: sinalyx-mobile
    runtime: docker
    rootDir: "Projeto de tcc/Sinalyx/sinalyx_mobile"
    dockerfilePath: ./Dockerfile
    plan: free
    # Após o deploy da API (sinalyx-api), lembre-se de colocar a URL gerada pelo 
    # Render no arquivo api_service.dart e fazer um novo git push!
